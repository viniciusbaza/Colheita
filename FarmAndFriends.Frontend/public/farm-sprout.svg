<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Broto do Farm &amp; Friends</title>
  <desc id="description">Um pequeno broto verde nascendo da terra</desc>

  <defs>
    <linearGradient id="badge" x1="10" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffef1" />
      <stop offset="1" stop-color="#fff3c4" />
    </linearGradient>
    <linearGradient id="leaf-left" x1="16" y1="21" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ce84f" />
      <stop offset="1" stop-color="#54b938" />
    </linearGradient>
    <linearGradient id="leaf-right" x1="31" y1="20" x2="49" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b6ef58" />
      <stop offset="1" stop-color="#62c43b" />
    </linearGradient>
    <linearGradient id="soil" x1="22" y1="43" x2="41" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a86547" />
      <stop offset="1" stop-color="#70402f" />
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#476b37" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#badge)" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#d9e9b7" stroke-width="2" />

  <g filter="url(#soft-shadow)">
    <path
      d="M31.4 44.5c-.4-6.5-.2-12.1.6-16.8"
      fill="none"
      stroke="#428f34"
      stroke-width="3.4"
      stroke-linecap="round"
    />
    <path
      d="M31.6 31.2C26 31.7 19.8 29 16.2 23.5c5.6-1.7 12.9-.2 16.3 4.7.8 1.2.3 2.7-.9 3Z"
      fill="url(#leaf-left)"
      stroke="#4aa137"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
    <path
      d="M32 29.1c3.6-5.4 10.4-7.6 17-5.8-.9 6.3-6.1 10.1-13.1 9.7-2.3-.1-4.2-1.9-3.9-3.9Z"
      fill="url(#leaf-right)"
      stroke="#56aa37"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
    <path
      d="M19.9 48.5c1.9-5 6-7.5 12.3-7.5 6.1 0 10.1 2.5 11.9 7.5-4.5 2-8.5 2.9-12.1 2.9-3.7 0-7.7-.9-12.1-2.9Z"
      fill="url(#soil)"
      stroke="#693c2d"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <path
      d="M24.2 46.7c2.2-1.5 4.8-2.2 7.8-2.2 3.1 0 5.7.7 7.9 2.2"
      fill="none"
      stroke="#c9855d"
      stroke-width="1.4"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>

  <path d="M20.3 24.7c3.5.2 6.8 1.4 9.8 3.8" fill="none" stroke="#d5f68a" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <path d="M36.2 29.3c2.7-2.5 5.8-3.9 9.4-4.3" fill="none" stroke="#e3f8a0" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
</svg>
